name: Build MATRESHKARP

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  SERVER_IP: "94.23.168.153"
  SERVER_PORT: "2144"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4

      - name: Patch all .so binaries
        run: |
          IP="${{ env.SERVER_IP }}"
          PORT="${{ env.SERVER_PORT }}"
          echo "Patching all .so files for IP: $IP:$PORT"
          python3 << 'PYEOF'
          import os
          import struct
          SO_DIR = "app/src/main/jniLibs/armeabi-v7a"
          OLD_IP = b"65.108.99.34"
          NEW_IP = b"94.23.168.153"
          OLD_PORT = struct.pack('<H', 2369)
          NEW_PORT = struct.pack('<H', 2144)
          patched_files = []
          for filename in os.listdir(SO_DIR):
              if not filename.endswith('.so'):
                  continue
              filepath = os.path.join(SO_DIR, filename)
              with open(filepath, "rb") as f:
                  data = bytearray(f.read())
              ip_count = data.count(OLD_IP)
              port_count = data.count(OLD_PORT)
              if ip_count > 0 or port_count > 0:
                  if ip_count > 0:
                      padded_ip = NEW_IP.ljust(len(OLD_IP), b'\x00')
                      data = data.replace(OLD_IP, padded_ip)
                  if port_count > 0:
                      data = data.replace(OLD_PORT, NEW_PORT)
                  with open(filepath, "wb") as f:
                      f.write(data)
                  patched_files.append(f"{filename}: IP={ip_count}, Port={port_count}")
          if patched_files:
              print("Patched files:")
              for f in patched_files:
                  print(f"  {f}")
          else:
              print("No old IP/Port found")
          PYEOF

      - name: Fix package names
        run: |
          echo "=== START FIXING ==="
          python3 << 'PYEOF'
          import os
          fixed = 0
          def fix(path):
              global fixed
              with open(path, 'r', encoding='utf-8') as f:
                  content = f.read()
              orig = content
              content = content.replace('com.byparad1st', 'com.Parad1st')
              content = content.replace("applicationId 'com.Parad1stgames.game'", "applicationId 'com.Parad1st.game'")
              content = content.replace('applicationId "com.Parad1stgames.game"', "applicationId 'com.Parad1st.game'")
              if content != orig:
                  with open(path, 'w', encoding='utf-8') as f:
                      f.write(content)
                  print(f'[FIXED] {path}')
                  fixed += 1
          for root, dirs, files in os.walk('app/src/main/java'):
              for file in files:
                  if file.endswith('.java'):
                      fix(os.path.join(root, file))
          fix('app/build.gradle')
          fix('app/src/main/AndroidManifest.xml')
          print(f'=== FIXED {fixed} FILES ===')
          PYEOF

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          sdkmanager --licenses < /dev/null || true

      - name: Delete old keystore
        run: rm -f app/edgar.jks

      - name: Create debug keystore
        run: |
          keytool -genkey -v -keystore app/edgar.jks -alias key0 -keyalg RSA -keysize 2048 -validity 10000 -storepass edgar333 -keypass edgar333 -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, S=Debug, C=US"

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew clean assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: matreshka-release
          path: app/build/outputs/apk/ver/release/*.apk
          if-no-files-found: error
