name: Build MATRESHKARP

on:
  workflow_dispatch:
    inputs:
      server_ip:
        description: 'Server IP (e.g. 94.23.168.153)'
        required: true
        default: '94.23.168.153'
      server_port:
        description: 'Server Port (e.g. 2144)'
        required: true
        default: '2144'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      # ───────────────────────────────────────────────
      # 1. Checkout your repo
      # ───────────────────────────────────────────────
      - name: Checkout your repo
        uses: actions/checkout@v4

      # ───────────────────────────────────────────────
      # 2. Checkout Parad1st source (Jni source only)
      # ───────────────────────────────────────────────
      - name: Checkout Parad1st source
        uses: actions/checkout@v4
        with:
          repository: Parad1st/Black-Russia-Source
          path: parad1st-source

      # ───────────────────────────────────────────────
      # 3. Copy Jni source → fix space issue by renaming
      # ───────────────────────────────────────────────
      - name: Copy Jni source (fix spaces)
        run: |
          echo "Copying Jni source from Parad1st..."
          cp -r "parad1st-source/Jni source" "./jni_source"
          ls -la jni_source/jni/

      # ───────────────────────────────────────────────
      # 4. Patch server IP/Port in CNetwork.cpp
      # ───────────────────────────────────────────────
      - name: Patch server IP/Port
        run: |
          SERVER_IP="${{ github.event.inputs.server_ip || '94.23.168.153' }}"
          SERVER_PORT="${{ github.event.inputs.server_port || '2144' }}"

          # Calculate sum from IP (94+23+168+153 = 438)
          SUM=$(echo "$SERVER_IP" | awk -F. '{print $1+$2+$3+$4}')
          LEN=${#SERVER_IP}

          echo "Setting server: $SERVER_IP:$SERVER_PORT (sum=$SUM, len=$LEN)"

          FILE="jni_source/jni/clientlogic/CNetwork.cpp"

          # Replace both server lines
          sed -i "s|CSetServer::create(\".*\", [0-9]\+, [0-9]\+, [0-9]\+, false)|CSetServer::create(\"$SERVER_IP\", $SUM, $LEN, $SERVER_PORT, false)|g" "$FILE"

          echo "Patched CNetwork.cpp:"
          grep "CSetServer::create" "$FILE"

      # ───────────────────────────────────────────────
      # 5. Fix Application.mk (gnustl_static removed in NDK r18+)
      # ───────────────────────────────────────────────
      - name: Fix Application.mk for NDK 25
        run: |
          echo "Fixing APP_STL from gnustl_static to c++_shared..."
          sed -i 's/APP_STL := gnustl_static/APP_STL := c++_shared/' jni_source/jni/Application.mk
          cat jni_source/jni/Application.mk

      # ───────────────────────────────────────────────
      # 6. Setup Java + Android SDK + NDK
      # ───────────────────────────────────────────────
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK + NDK
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"
          sdkmanager --licenses < /dev/null || true

      # ───────────────────────────────────────────────
      # 7. Build libsamp.so (NO SPACES in path!)
      # ───────────────────────────────────────────────
      - name: Build libsamp.so
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/25.2.9519653"
          export PATH="$ANDROID_NDK_HOME:$PATH"

          echo "Building libsamp.so..."
          cd jni_source

          # ndk-build looks for jni/Android.mk — path has NO spaces now
          "$ANDROID_NDK_HOME/ndk-build" -j$(nproc)

          echo "Build complete. Output:"
          ls -la libs/armeabi-v7a/

      # ───────────────────────────────────────────────
      # 8. Replace libsamp.so in your project
      # ───────────────────────────────────────────────
      - name: Replace libsamp.so
        run: |
          echo "Replacing old libsamp.so with new one..."
          cp -v "jni_source/libs/armeabi-v7a/libsamp.so" "app/src/main/jniLibs/armeabi-v7a/libsamp.so"

          echo "New libsamp.so info:"
          ls -la "app/src/main/jniLibs/armeabi-v7a/libsamp.so"
          file "app/src/main/jniLibs/armeabi-v7a/libsamp.so"

      # ───────────────────────────────────────────────
      # 9. Keystore + APK Build (same as your original)
      # ───────────────────────────────────────────────
      - name: Delete old keystore
        run: rm -f app/edgar.jks

      - name: Create debug keystore
        run: |
          keytool -genkey -v -keystore app/edgar.jks -alias key0 -keyalg RSA -keysize 2048 -validity 10000 -storepass edgar333 -keypass edgar333 -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, S=Debug, C=US"

      - name: Check BASS library exists
        run: |
          echo "Checking BASS libraries..."
          ls -la app/src/main/cpp/vendor/bass/libs/ || echo "BASS libs folder not found"
          find app/src/main/cpp -name "libbass.so" || echo "libbass.so not found anywhere"

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew clean assembleRelease --no-daemon --refresh-dependencies --stacktrace 2>&1 | tee build.log
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/25.2.9519653

      # ───────────────────────────────────────────────
      # 10. Upload artifacts (same as your original)
      # ───────────────────────────────────────────────
      - name: Upload build log (even if failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload libsamp.so
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libsamp-so
          path: app/src/main/jniLibs/armeabi-v7a/libsamp.so

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: matreshka-release
          path: app/build/outputs/apk/ver/release/*.apk
          if-no-files-found: error
