name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-30" "build-tools;30.0.1"

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew clean :app:assembleVerRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: samp-mobile-release
          path: app/build/outputs/apk/ver/release/*.apk
          if-no-files-found: error
