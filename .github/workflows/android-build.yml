name: Build MATRESHKARP (Final Fix)

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  SERVER_IP: "94.23.168.153"
  SERVER_PORT: "2144"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4

      - name: Fix build.gradle
        run: |
          sed -i '/applicationIdSuffix/d' app/build.gradle
          sed -i "s/abiFilters 'armeabi-v7a', 'arm64-v8a'/abiFilters 'armeabi-v7a'/g" app/build.gradle

      - name: Fix AndroidManifest.xml
        run: |
          sed -i 's|<uses-permission android:name="android.permission.RECORD_AUDIO" />|<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />|g' app/src/main/AndroidManifest.xml

      - name: Fix NvEventQueueActivity
        run: |
          sed -i 's|"com.blackrussia.launcher"|"com.byparad1st.game"|g' app/src/main/java/com/nvidia/devtech/NvEventQueueActivity.java

      # ── PYTHON FIX: Reliable path replacement with verification ──
      - name: Fix Java files to use EXTERNAL storage (VERIFIED)
        run: |
          python3 << 'PYEOF'
          import re
          
          def fix_main_activity():
              with open('app/src/main/java/com/Parad1st/launcher/activity/MainActivity.java', 'r') as f:
                  content = f.read()
              
              # Replace getGameDir() method to use external storage
              old_getGameDir = 'private File getGameDir() {\n\t\treturn new File(getExternalFilesDir(null), "LUXRUSSIA");\n\t}'
              new_getGameDir = 'private File getGameDir() {\n\t\treturn new File(Environment.getExternalStorageDirectory(), "LUXRUSSIA");\n\t}'
              
              if old_getGameDir in content:
                  content = content.replace(old_getGameDir, new_getGameDir)
                  print("✅ FIXED: getGameDir() uses ExternalStorageDirectory")
              else:
                  print("❌ NOT FOUND: getGameDir() pattern")
                  # Try alternative pattern
                  content = re.sub(
                      r'private File getGameDir\(\) \{\s*return new File\(getExternalFilesDir\(null\), "LUXRUSSIA"\);\s*\}',
                      'private File getGameDir() {\n\t\treturn new File(Environment.getExternalStorageDirectory(), "LUXRUSSIA");\n\t}',
                      content
                  )
                  print("✅ FIXED (regex): getGameDir() uses ExternalStorageDirectory")
              
              # Replace getSettingsFile()
              old_settings = 'return new File(getGameDir(), "SAMP/settings.ini");'
              new_settings = 'return new File(Environment.getExternalStorageDirectory(), "LUXRUSSIA/SAMP/settings.ini");'
              
              if old_settings in content:
                  content = content.replace(old_settings, new_settings)
                  print("✅ FIXED: getSettingsFile() uses external path")
              else:
                  print("❌ NOT FOUND: getSettingsFile() pattern")
              
              # Replace getGameCheckFile()
              old_check = 'return new File(getGameDir(), "texdb/gta3.img");'
              new_check = 'return new File(Environment.getExternalStorageDirectory(), "LUXRUSSIA/texdb/gta3.img");'
              
              if old_check in content:
                  content = content.replace(old_check, new_check)
                  print("✅ FIXED: getGameCheckFile() uses external path")
              else:
                  print("❌ NOT FOUND: getGameCheckFile() pattern")
              
              with open('app/src/main/java/com/Parad1st/launcher/activity/MainActivity.java', 'w') as f:
                  f.write(content)
          
          def fix_loader_activity():
              with open('app/src/main/java/com/Parad1st/launcher/activity/LoaderActivity.java', 'r') as f:
                  content = f.read()
              
              # Replace getGameDir()
              old_getGameDir = 'private File getGameDir() {\n\t\treturn new File(getExternalFilesDir(null), "LUXRUSSIA");\n\t}'
              new_getGameDir = 'private File getGameDir() {\n\t\treturn new File(Environment.getExternalStorageDirectory(), "LUXRUSSIA");\n\t}'
              
              if old_getGameDir in content:
                  content = content.replace(old_getGameDir, new_getGameDir)
                  print("✅ FIXED: LoaderActivity getGameDir() uses ExternalStorageDirectory")
              else:
                  print("❌ NOT FOUND: LoaderActivity getGameDir() pattern")
                  # Try regex
                  content = re.sub(
                      r'private File getGameDir\(\) \{\s*return new File\(getExternalFilesDir\(null\), "LUXRUSSIA"\);\s*\}',
                      'private File getGameDir() {\n\t\treturn new File(Environment.getExternalStorageDirectory(), "LUXRUSSIA");\n\t}',
                      content
                  )
                  print("✅ FIXED (regex): LoaderActivity getGameDir() uses ExternalStorageDirectory")
              
              # Replace folder assignment
              old_folder = 'folder = getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS);'
              new_folder = 'folder = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);'
              
              if old_folder in content:
                  content = content.replace(old_folder, new_folder)
                  print("✅ FIXED: folder uses ExternalStoragePublicDirectory")
              else:
                  print("❌ NOT FOUND: folder pattern")
              
              # Replace mInputFilePath
              old_input = 'new File(getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS), "black-cache.7z").getAbsolutePath()'
              new_input = 'new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "black-cache.7z").getAbsolutePath()'
              
              if old_input in content:
                  content = content.replace(old_input, new_input)
                  print("✅ FIXED: mInputFilePath uses external path")
              else:
                  print("❌ NOT FOUND: mInputFilePath pattern")
              
              # Replace mOutputPath
              old_output = 'String mOutputPath = getGameDir().getAbsolutePath();'
              new_output = 'String mOutputPath = Environment.getExternalStorageDirectory().getAbsolutePath();'
              
              if old_output in content:
                  content = content.replace(old_output, new_output)
                  print("✅ FIXED: mOutputPath uses external path")
              else:
                  print("❌ NOT FOUND: mOutputPath pattern")
              
              # Replace Utils.delete for .7z
              old_delete1 = 'Utils.delete(new File(getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS), "black-cache.7z"));'
              new_delete1 = 'Utils.delete(new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "black-cache.7z"));'
              
              if old_delete1 in content:
                  content = content.replace(old_delete1, new_delete1)
                  print("✅ FIXED: delete .7z uses external path")
              else:
                  print("❌ NOT FOUND: delete .7z pattern")
              
              # Replace Utils.delete for .temp
              old_delete2 = 'Utils.delete(new File(getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS), "black-cache.7z.temp"));'
              new_delete2 = 'Utils.delete(new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "black-cache.7z.temp"));'
              
              if old_delete2 in content:
                  content = content.replace(old_delete2, new_delete2)
                  print("✅ FIXED: delete .temp uses external path")
              else:
                  print("❌ NOT FOUND: delete .temp pattern")
              
              with open('app/src/main/java/com/Parad1st/launcher/activity/LoaderActivity.java', 'w') as f:
                  f.write(content)
          
          print("=== FIXING MainActivity.java ===")
          fix_main_activity()
          print("\n=== FIXING LoaderActivity.java ===")
          fix_loader_activity()
          print("\n=== DONE ===")
          PYEOF

      - name: Verify Java files were fixed
        run: |
          echo "=== MainActivity.java getGameDir() ==="
          grep -A2 "private File getGameDir()" app/src/main/java/com/Parad1st/launcher/activity/MainActivity.java || echo "NOT FOUND"
          echo "=== MainActivity.java getSettingsFile() ==="
          grep "SAMP/settings.ini" app/src/main/java/com/Parad1st/launcher/activity/MainActivity.java || echo "NOT FOUND"
          echo "=== LoaderActivity.java getGameDir() ==="
          grep -A2 "private File getGameDir()" app/src/main/java/com/Parad1st/launcher/activity/LoaderActivity.java || echo "NOT FOUND"
          echo "=== LoaderActivity.java folder ==="
          grep "folder =" app/src/main/java/com/Parad1st/launcher/activity/LoaderActivity.java || echo "NOT FOUND"

      - name: Create local server files
        run: |
          mkdir -p app/src/main/assets
          echo '[{"color":"FF0000","dopname":"MATRESHKA RP","maxonline":1000,"name":"MATRESHKA","online":0}]' > app/src/main/assets/server.json
          echo '[]' > app/src/main/assets/stories.json

      - name: Patch Interface.java
        run: |
          INTERFACE="app/src/main/java/com/Parad1st/launcher/other/Interface.java"
          if [ -f "$INTERFACE" ]; then
            sed -i 's|https://raw.githubusercontent.com/Parad1st/Black-Russia-Source/main/Json%20files/servers.json|file:///android_asset/server.json|g' "$INTERFACE"
            sed -i 's|https://raw.githubusercontent.com/Parad1st/Black-Russia-Source/main/Json%20files/stories.json|file:///android_asset/stories.json|g' "$INTERFACE"
          fi

      - name: Download .so files
        run: |
          SO_DIR="app/src/main/jniLibs/armeabi-v7a"
          mkdir -p "$SO_DIR"
          BASE="https://raw.githubusercontent.com/Parad1st/Black-Russia-Source/main/app/src/main/jniLibs/armeabi-v7a"
          for f in libGTASA.so libImmEmulatorJ.so libSCAnd.so libbass.so libparad1st.so libsampvoice.so; do
            curl -sL "$BASE/$f" -o "$SO_DIR/$f"
            SIZE=$(stat -c%s "$SO_DIR/$f" 2>/dev/null || echo 0)
            if [ "$SIZE" -lt 1000 ]; then echo "ERROR: $f"; exit 1; fi
            echo "$f OK ($SIZE bytes)"
          done
          rm -rf app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/x86 app/src/main/jniLibs/x86_64

      - name: Patch .so binaries
        run: |
          python3 << 'PYEOF'
          import os, struct
          SO_DIR = 'app/src/main/jniLibs/armeabi-v7a'
          NEW_IP = bytes([94, 23, 168, 153])
          NEW_PORT = struct.pack('<H', 2144)
          OLD_IPS = [bytes([65,108,99,34]), bytes([0,0,0,0]), bytes([127,0,0,1])]
          OLD_PORTS = [struct.pack('<H',2369), struct.pack('<H',7777), struct.pack('<H',0)]
          for filename in os.listdir(SO_DIR):
              if not filename.endswith('.so'): continue
              filepath = os.path.join(SO_DIR, filename)
              with open(filepath, 'rb') as f: data = bytearray(f.read())
              for old_ip in OLD_IPS:
                  count = data.count(old_ip)
                  if count > 0: data = data.replace(old_ip, NEW_IP); print(f"  {filename}: IP patched ({count}x)")
              for old_port in OLD_PORTS:
                  count = data.count(old_port)
                  if count > 0: data = data.replace(old_port, NEW_PORT); print(f"  {filename}: Port patched ({count}x)")
              with open(filepath, 'wb') as f: f.write(data)
          PYEOF

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          sdkmanager --licenses < /dev/null || true

      - name: Create debug keystore
        run: |
          rm -f app/edgar.jks
          keytool -genkey -v -keystore app/edgar.jks -alias key0 -keyalg RSA -keysize 2048 -validity 10000 -storepass edgar333 -keypass edgar333 -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, S=Debug, C=US"

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew clean assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: matreshka-release
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn١
