name: Build Sahil RP

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  SERVER_IP: "94.23.168.153"
  SERVER_PORT: "2144"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4

      # ── 1. CHANGE PACKAGE NAME EVERYWHERE ──
      - name: Change package name to com.Sahil.RP
        run: |
          echo "=== CHANGING PACKAGE NAME ==="
          
          # build.gradle
          sed -i "s/applicationId 'com\\.parad1stgames\\.game'/applicationId 'com.Sahil.RP'/g" app/build.gradle
          sed -i "s/namespace 'com\\.parad1stgames\\.game'/namespace 'com.Sahil.RP'/g" app/build.gradle
          sed -i '/applicationIdSuffix/d' app/build.gradle
          sed -i "s/abiFilters 'armeabi-v7a', 'arm64-v8a'/abiFilters 'armeabi-v7a'/g" app/build.gradle
          
          # AndroidManifest.xml
          sed -i 's/package="com\.parad1stgames\.game"/package="com.Sahil.RP"/g' app/src/main/AndroidManifest.xml
          
          # All Java files - change package declarations and imports
          find app/src/main/java -type f -name "*.java" -exec sed -i 's/com\.byparad1st\.game/com.Sahil.RP/g' {} +
          find app/src/main/java -type f -name "*.java" -exec sed -i 's/com\.Parad1st\.launcher/com.Sahil.launcher/g' {} +
          find app/src/main/java -type f -name "*.java" -exec sed -i 's/com\.byparad1st\.launcher/com.Sahil.launcher/g' {} +
          
          # Resources XML
          find app/src/main/res -type f \( -name "*.xml" -o -name "*.json" \) -exec sed -i 's/com\.byparad1st\.game/com.Sahil.RP/g' {} + 2>/dev/null || true
          find app/src/main/res -type f \( -name "*.xml" -o -name "*.json" \) -exec sed -i 's/com\.parad1stgames\.game/com.Sahil.RP/g' {} + 2>/dev/null || true
          
          echo "Package name changed to com.Sahil.RP"

      # ── 2. FIX JAVA PATHS TO USE INTERNAL STORAGE ──
      - name: Fix Java files to use internal paths
        run: |
          echo "=== FIXING PATHS TO INTERNAL STORAGE ==="
          
          # MainActivity.java - use getFilesDir() instead of ExternalStorage
          sed -i 's|Environment.getExternalStorageDirectory(), "LUXRUSSIA"|getFilesDir()|g' app/src/main/java/com/Sahil/launcher/activity/MainActivity.java 2>/dev/null || \
          sed -i 's|Environment.getExternalStorageDirectory(), "LUXRUSSIA"|getFilesDir()|g' app/src/main/java/com/Parad1st/launcher/activity/MainActivity.java 2>/dev/null || \
          sed -i 's|Environment.getExternalStorageDirectory(), "LUXRUSSIA"|getFilesDir()|g' app/src/main/java/com/byparad1st/launcher/activity/MainActivity.java 2>/dev/null || true
          
          sed -i 's|Environment.getExternalStorageDirectory() + "/LUXRUSSIA/SAMP/settings.ini"|new File(getFilesDir(), "SAMP/settings.ini").getAbsolutePath()|g' app/src/main/java/com/Sahil/launcher/activity/MainActivity.java 2>/dev/null || \
          sed -i 's|Environment.getExternalStorageDirectory() + "/LUXRUSSIA/SAMP/settings.ini"|new File(getFilesDir(), "SAMP/settings.ini").getAbsolutePath()|g' app/src/main/java/com/Parad1st/launcher/activity/MainActivity.java 2>/dev/null || \
          sed -i 's|Environment.getExternalStorageDirectory() + "/LUXRUSSIA/SAMP/settings.ini"|new File(getFilesDir(), "SAMP/settings.ini").getAbsolutePath()|g' app/src/main/java/com/byparad1st/launcher/activity/MainActivity.java 2>/dev/null || true
          
          sed -i 's|Environment.getExternalStorageDirectory() + "/LUXRUSSIA/texdb/gta3.img"|new File(getFilesDir(), "texdb/gta3.img").getAbsolutePath()|g' app/src/main/java/com/Sahil/launcher/activity/MainActivity.java 2>/dev/null || \
          sed -i 's|Environment.getExternalStorageDirectory() + "/LUXRUSSIA/texdb/gta3.img"|new File(getFilesDir(), "texdb/gta3.img").getAbsolutePath()|g' app/src/main/java/com/Parad1st/launcher/activity/MainActivity.java 2>/dev/null || \
          sed -i 's|Environment.getExternalStorageDirectory() + "/LUXRUSSIA/texdb/gta3.img"|new File(getFilesDir(), "texdb/gta3.img").getAbsolutePath()|g' app/src/main/java/com/byparad1st/launcher/activity/MainActivity.java 2>/dev/null || true
          
          # LoaderActivity.java
          sed -i 's|Environment.getExternalStorageDirectory(), "LUXRUSSIA"|getFilesDir()|g' app/src/main/java/com/Sahil/launcher/activity/LoaderActivity.java 2>/dev/null || \
          sed -i 's|Environment.getExternalStorageDirectory(), "LUXRUSSIA"|getFilesDir()|g' app/src/main/java/com/Parad1st/launcher/activity/LoaderActivity.java 2>/dev/null || \
          sed -i 's|Environment.getExternalStorageDirectory(), "LUXRUSSIA"|getFilesDir()|g' app/src/main/java/com/byparad1st/launcher/activity/LoaderActivity.java 2>/dev/null || true
          
          sed -i 's|Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS)|getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS)|g' app/src/main/java/com/Sahil/launcher/activity/LoaderActivity.java 2>/dev/null || \
          sed -i 's|Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS)|getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS)|g' app/src/main/java/com/Parad1st/launcher/activity/LoaderActivity.java 2>/dev/null || \
          sed -i 's|Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS)|getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS)|g' app/src/main/java/com/byparad1st/launcher/activity/LoaderActivity.java 2>/dev/null || true
          
          echo "Paths fixed to internal storage"

      # ── 3. FIX NvEventQueueActivity.java ──
      - name: Fix NvEventQueueActivity
        run: |
          sed -i 's/com\.blackrussia\.launcher/com.Sahil.RP/g' app/src/main/java/com/nvidia/devtech/NvEventQueueActivity.java
          sed -i 's/com\.byparad1st\.game/com.Sahil.RP/g' app/src/main/java/com/nvidia/devtech/NvEventQueueActivity.java

      # ── 4. CREATE LOCAL SERVER FILES ──
      - name: Create local server files
        run: |
          mkdir -p app/src/main/assets
          echo '[{"color":"FF0000","dopname":"SAHIL RP","maxonline":1000,"name":"SAHIL","online":0}]' > app/src/main/assets/server.json
          echo '[]' > app/src/main/assets/stories.json

      # ── 5. PATCH Interface.java ──
      - name: Patch Interface.java
        run: |
          for path in app/src/main/java/com/Sahil/launcher/other/Interface.java app/src/main/java/com/Parad1st/launcher/other/Interface.java app/src/main/java/com/byparad1st/launcher/other/Interface.java; do
            if [ -f "$path" ]; then
              sed -i 's|https://raw.githubusercontent.com/Parad1st/Black-Russia-Source/main/Json%20files/servers.json|file:///android_asset/server.json|g' "$path"
              sed -i 's|https://raw.githubusercontent.com/Parad1st/Black-Russia-Source/main/Json%20files/stories.json|file:///android_asset/stories.json|g' "$path"
              echo "Patched: $path"
            fi
          done

      # ── 6. DOWNLOAD .SO FILES ──
      - name: Download fresh .so files
        run: |
          SO_DIR="app/src/main/jniLibs/armeabi-v7a"
          mkdir -p "$SO_DIR"
          BASE="https://raw.githubusercontent.com/Parad1st/Black-Russia-Source/main/app/src/main/jniLibs/armeabi-v7a"
          for f in libGTASA.so libImmEmulatorJ.so libSCAnd.so libbass.so libparad1st.so libsampvoice.so; do
            curl -sL "$BASE/$f" -o "$SO_DIR/$f"
            SIZE=$(stat -c%s "$SO_DIR/$f" 2>/dev/null || echo 0)
            if [ "$SIZE" -lt 1000 ]; then echo "ERROR: $f failed"; exit 1; fi
            echo "$f OK ($SIZE bytes)"
          done
          rm -rf app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/x86 app/src/main/jniLibs/x86_64

      # ── 7. PATCH .SO BINARIES (PACKAGE NAME + IP + PORT) ──
      - name: Patch .so binaries
        run: |
          python3 - "$SO_DIR" "$SERVER_IP" "$SERVER_PORT" <<'ENDSCRIPT'
          import sys, os, struct
          
          SO_DIR = sys.argv[1]
          ip_parts = sys.argv[2].split(".")
          NEW_IP = bytes([int(ip_parts[0]), int(ip_parts[1]), int(ip_parts[2]), int(ip_parts[3])])
          NEW_PORT = struct.pack("<H", int(sys.argv[3]))
          
          OLD_PACKAGE = b"com.byparad1st.game"
          NEW_PACKAGE = b"com.Sahil.RP\x00\x00\x00\x00\x00\x00\x00"
          
          OLD_IPS = [bytes([65,108,99,34]), bytes([0,0,0,0]), bytes([127,0,0,1])]
          OLD_PORTS = [struct.pack("<H",2369), struct.pack("<H",7777), struct.pack("<H",0)]
          
          for filename in os.listdir(SO_DIR):
              if not filename.endswith(".so"):
                  continue
              filepath = os.path.join(SO_DIR, filename)
              with open(filepath, "rb") as f:
                  data = bytearray(f.read())
              
              # Patch package name
              if OLD_PACKAGE in data:
                  data = data.replace(OLD_PACKAGE, NEW_PACKAGE)
                  print(f"  {filename}: Package name patched")
              
              # Patch IPs
              for old_ip in OLD_IPS:
                  count = data.count(old_ip)
                  if count > 0:
                      data = data.replace(old_ip, NEW_IP)
                      print(f"  {filename}: IP patched ({count}x)")
              
              # Patch Ports
              for old_port in OLD_PORTS:
                  count = data.count(old_port)
                  if count > 0:
                      data = data.replace(old_port, NEW_PORT)
                      print(f"  {filename}: Port patched ({count}x)")
              
              with open(filepath, "wb") as f:
                  f.write(data)
          ENDSCRIPT

      # ── 8. BUILD ──
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          sdkmanager --licenses < /dev/null || true

      - name: Create debug keystore
        run: |
          rm -f app/edgar.jks
          keytool -genkey -v -keystore app/edgar.jks -alias key0 -keyalg RSA -keysize 2048 -validity 10000 -storepass edgar333 -keypass edgar333 -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, S=Debug, C=US"

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew clean assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      # ── 9. UPLOAD ──
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sahil-rp-release
          path: app/build/outputs/apk/ver/release/*.apk
          if-no-files-found: error
