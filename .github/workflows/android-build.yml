name: Build MATRESHKARP (Final Ultimate Fix v2)

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  SERVER_IP: "94.23.168.153"
  SERVER_PORT: "2144"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4

      # ── 1. FIX build.gradle ──
      - name: Fix build.gradle
        run: |
          echo "=== FIXING build.gradle ==="
          sed -i "s/applicationId 'com\\.parad1stgames\\.game'/applicationId 'com.byparad1st.game'/g" app/build.gradle
          sed -i "s/namespace 'com\\.parad1stgames\\.game'/namespace 'com.byparad1st.game'/g" app/build.gradle
          
          python3 << 'PYEOF'
          import re
          with open('app/build.gradle', 'r') as f:
              content = f.read()
          content = re.sub(r'.*applicationIdSuffix.*\n?', '', content)
          with open('app/build.gradle', 'w') as f:
              f.write(content)
          PYEOF
          
          sed -i "s/abiFilters 'armeabi-v7a', 'arm64-v8a'/abiFilters 'armeabi-v7a'/g" app/build.gradle
          echo "build.gradle fixed"

      # ── 2. FIX AndroidManifest.xml ──
      - name: Fix AndroidManifest.xml
        run: |
          sed -i 's/package="com\.parad1stgames\.game"/package="com.byparad1st.game"/g' app/src/main/AndroidManifest.xml
          echo "Manifest fixed"

      # ── 3. FIX NvEventQueueActivity.java ──
      - name: Fix NvEventQueueActivity
        run: |
          sed -i 's/com\.blackrussia\.launcher/com.byparad1st.game/g' app/src/main/java/com/nvidia/devtech/NvEventQueueActivity.java
          echo "NvEventQueueActivity fixed"

      # ── 4. FIX MainActivity.java TO USE EXTERNAL STORAGE ──
      - name: Fix MainActivity.java paths
        run: |
          echo "=== FIXING MainActivity.java PATHS ==="
          python3 << 'PYEOF'
          with open('app/src/main/java/com/Parad1st/launcher/activity/MainActivity.java', 'r') as f:
              content = f.read()
          
          # استبدال getExternalFilesDir(null) بـ Environment.getExternalStorageDirectory()
          content = content.replace(
              'private File getGameDir() {\n\t\treturn new File(getExternalFilesDir(null), "LUXRUSSIA");\n\t}',
              'private File getGameDir() {\n\t\treturn new File(Environment.getExternalStorageDirectory(), "LUXRUSSIA");\n\t}'
          )
          
          content = content.replace(
              'private File getSettingsFile() {\n\t\treturn new File(getGameDir(), "SAMP/settings.ini");\n\t}',
              'private File getSettingsFile() {\n\t\treturn new File(Environment.getExternalStorageDirectory() + "/LUXRUSSIA/SAMP/settings.ini");\n\t}'
          )
          
          content = content.replace(
              'private File getGameCheckFile() {\n\t\treturn new File(getGameDir(), "texdb/gta3.img");\n\t}',
              'private File getGameCheckFile() {\n\t\treturn new File(Environment.getExternalStorageDirectory() + "/LUXRUSSIA/texdb/gta3.img");\n\t}'
          )
          
          with open('app/src/main/java/com/Parad1st/launcher/activity/MainActivity.java', 'w') as f:
              f.write(content)
          
          print("MainActivity.java paths fixed")
          PYEOF

      # ── 5. FIX LoaderActivity.java TO USE EXTERNAL STORAGE ──
      - name: Fix LoaderActivity.java paths
        run: |
          echo "=== FIXING LoaderActivity.java PATHS ==="
          python3 << 'PYEOF'
          with open('app/src/main/java/com/Parad1st/launcher/activity/LoaderActivity.java', 'r') as f:
              content = f.read()
          
          content = content.replace(
              'private File getGameDir() {\n\t\treturn new File(getExternalFilesDir(null), "LUXRUSSIA");\n\t}',
              'private File getGameDir() {\n\t\treturn new File(Environment.getExternalStorageDirectory(), "LUXRUSSIA");\n\t}'
          )
          
          content = content.replace(
              'folder = getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS);',
              'folder = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);'
          )
          
          content = content.replace(
              'String mInputFilePath = new File(getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS), "black-cache.7z").getAbsolutePath();',
              'String mInputFilePath = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS) + "/black-cache.7z";'
          )
          
          content = content.replace(
              'Utils.delete(new File(getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS), "black-cache.7z"));',
              'Utils.delete(new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS) + "/black-cache.7z"));'
          )
          
          content = content.replace(
              'Utils.delete(new File(getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS), "black-cache.7z.temp"));',
              'Utils.delete(new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS) + "/black-cache.7z.temp"));'
          )
          
          with open('app/src/main/java/com/Parad1st/launcher/activity/LoaderActivity.java', 'w') as f:
              f.write(content)
          
          print("LoaderActivity.java paths fixed")
          PYEOF

      # ── 6. CREATE LOCAL server.json & stories.json ──
      - name: Create local server files
        run: |
          mkdir -p app/src/main/assets
          cat > app/src/main/assets/server.json << 'EOF'
          [{"color":"FF0000","dopname":"MATRESHKA RP","maxonline":1000,"name":"MATRESHKA","online":0}]
          EOF
          cat > app/src/main/assets/stories.json << 'EOF'
          []
          EOF

      # ── 7. PATCH Interface.java ──
      - name: Patch Interface.java
        run: |
          INTERFACE="app/src/main/java/com/Parad1st/launcher/other/Interface.java"
          if [ -f "$INTERFACE" ]; then
            sed -i 's|https://raw.githubusercontent.com/Parad1st/Black-Russia-Source/main/Json%20files/servers.json|file:///android_asset/server.json|g' "$INTERFACE"
            sed -i 's|https://raw.githubusercontent.com/Parad1st/Black-Russia-Source/main/Json%20files/stories.json|file:///android_asset/stories.json|g' "$INTERFACE"
            sed -i 's|https://raw.githubusercontent.com/Parad1st/Black-Russia-Source/main/Json%20files/donate.json|file:///android_asset/server.json|g' "$INTERFACE"
            sed -i 's|https://raw.githubusercontent.com/Parad1st/Black-Russia-Source/main/Json%20files/music.json|file:///android_asset/stories.json|g' "$INTERFACE"
          fi

      # ── 8. Download .so files ──
      - name: Download fresh .so files
        run: |
          SO_DIR="app/src/main/jniLibs/armeabi-v7a"
          mkdir -p "$SO_DIR"
          BASE="https://raw.githubusercontent.com/Parad1st/Black-Russia-Source/main/app/src/main/jniLibs/armeabi-v7a"
          for f in libGTASA.so libImmEmulatorJ.so libSCAnd.so libbass.so libparad1st.so libsampvoice.so; do
            curl -sL "$BASE/$f" -o "$SO_DIR/$f"
            SIZE=$(stat -c%s "$SO_DIR/$f" 2>/dev/null || echo 0)
            if [ "$SIZE" -lt 1000 ]; then echo "ERROR: $f"; exit 1; fi
            echo "$f OK"
          done
          rm -rf app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/x86 app/src/main/jniLibs/x86_64

      # ── 9. PATCH .so files ──
      - name: Patch .so binaries
        run: |
          python3 << 'PYEOF'
          import os, struct
          SO_DIR = "app/src/main/jniLibs/armeabi-v7a"
          NEW_IP = bytes([94, 23, 168, 153])
          NEW_PORT = struct.pack('<H', 2144)
          OLD_IPS = [bytes([65, 108, 99, 34]), bytes([0, 0, 0, 0]), bytes([127, 0, 0, 1])]
          OLD_PORTS = [struct.pack('<H', 2369), struct.pack('<H', 7777), struct.pack('<H', 0)]
          for filename in os.listdir(SO_DIR):
              if not filename.endswith('.so'): continue
              filepath = os.path.join(SO_DIR, filename)
              with open(filepath, "rb") as f: data = bytearray(f.read())
              for old_ip in OLD_IPS:
                  count = data.count(old_ip)
                  if count > 0: data = data.replace(old_ip, NEW_IP)
              for old_port in OLD_PORTS:
                  count = data.count(old_port)
                  if count > 0: data = data.replace(old_port, NEW_PORT)
              with open(filepath, "wb") as f: f.write(data)
          PYEOF

      # ── 10. Build ──
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          sdkmanager --licenses < /dev/null || true

      - name: Create debug keystore
        run: |
          rm -f app/edgar.jks
          keytool -genkey -v -keystore app/edgar.jks -alias key0 -keyalg RSA -keysize 2048 -validity 10000 -storepass edgar333 -keypass edgar333 -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, S=Debug, C=US"

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew clean assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      # ── 11. Upload ──
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: matreshka-release
          path: app/build/outputs/apk/ver/release/*.apk
          if-no-files-found: error
