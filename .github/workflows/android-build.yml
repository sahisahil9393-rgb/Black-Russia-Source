name: Build Sahil RP with Custom libGTASA.so

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  SERVER_IP: "94.23.168.153"
  SERVER_PORT: "2144"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4

      # ── CLONE Ocasa1050 SOURCE CODE ──
      - name: Clone Ocasa1050 C++ source
        run: |
          git clone --depth 1 https://github.com/Ocasa1050/2.2-MATRESHKARP-2.1-GTASA-64x.git /tmp/ocasa-source

      # ── MODIFY C++ SOURCE TO USE INTERNAL PATH ──
      - name: Modify C++ source for internal path
        run: |
          echo "=== MODIFYING C++ SOURCE ==="
          
          # Find where g_pszStorage is set
          grep -rn "g_pszStorage" /tmp/ocasa-source/app/src/main/cpp/ || true
          
          # Modify main.cpp to set g_pszStorage to internal path
          cat > /tmp/patch_storage.py << 'PYEOF'
          import os
          
          # Find all .cpp files
          for root, dirs, files in os.walk('/tmp/ocasa-source/app/src/main/cpp/'):
              for file in files:
                  if file.endswith('.cpp'):
                      filepath = os.path.join(root, file)
                      with open(filepath, 'r') as f:
                          content = f.read()
                      
                      # Replace external storage path with internal
                      content = content.replace(
                          'char* g_pszStorage = nullptr;',
                          'char* g_pszStorage = (char*)"/data/data/com.Sahil.RP/files/LUXRUSSIA/";'
                      )
                      
                      with open(filepath, 'w') as f:
                          f.write(content)
          
          print("C++ source patched for internal storage")
          PYEOF
          
          python3 /tmp/patch_storage.py

      # ── SETUP ANDROID NDK ──
      - name: Setup Android NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          sdkmanager "ndk;25.2.9519653"

      # ── BUILD libGTASA.so FROM SOURCE ──
      - name: Build libGTASA.so from source
        run: |
          cd /tmp/ocasa-source/app/src/main/cpp
          mkdir -p build
          cd build
          
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release
          
          make -j$(nproc)
          
          # Copy built library
          cp build/libGTASA.so $GITHUB_WORKSPACE/app/src/main/jniLibs/armeabi-v7a/
          cp build/libsamp.so $GITHUB_WORKSPACE/app/src/main/jniLibs/armeabi-v7a/
          echo "libGTASA.so built from source with internal path"

      # ── FIX build.gradle ──
      - name: Fix build.gradle
        run: |
          sed -i "s/applicationId 'com\\.parad1stgames\\.game'/applicationId 'com.Sahil.RP'/g" app/build.gradle
          sed -i "s/namespace 'com\\.parad1stgames\\.game'/namespace 'com.Sahil.RP'/g" app/build.gradle
          sed -i '/applicationIdSuffix/d' app/build.gradle
          sed -i "s/abiFilters 'armeabi-v7a', 'arm64-v8a'/abiFilters 'armeabi-v7a'/g" app/build.gradle

      - name: Fix AndroidManifest.xml
        run: |
          sed -i 's/package="com\.parad1stgames\.game"/package="com.Sahil.RP"/g' app/src/main/AndroidManifest.xml

      - name: Fix NvEventQueueActivity
        run: |
          sed -i 's/com\.blackrussia\.launcher/com.Sahil.RP/g' app/src/main/java/com/nvidia/devtech/NvEventQueueActivity.java

      - name: Fix Java files to use internal path
        run: |
          python3 << 'EOF'
          import os
          
          def fix_file(path, replacements):
              with open(path, 'r') as f:
                  content = f.read()
              for old, new in replacements:
                  if old in content:
                      content = content.replace(old, new)
                      print(f"  FIXED: {path}")
              with open(path, 'w') as f:
                  f.write(content)
          
          fix_file('app/src/main/java/com/Parad1st/launcher/activity/MainActivity.java', [
              ('return new File(getExternalFilesDir(null), "LUXRUSSIA");', 'return new File(getFilesDir(), "LUXRUSSIA");'),
              ('return new File(getGameDir(), "SAMP/settings.ini");', 'return new File(getFilesDir(), "LUXRUSSIA/SAMP/settings.ini");'),
              ('return new File(getGameDir(), "texdb/gta3.img");', 'return new File(getFilesDir(), "LUXRUSSIA/texdb/gta3.img");'),
          ])
          
          fix_file('app/src/main/java/com/Parad1st/launcher/activity/LoaderActivity.java', [
              ('return new File(getExternalFilesDir(null), "LUXRUSSIA");', 'return new File(getFilesDir(), "LUXRUSSIA");'),
              ('folder = getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS);', 'folder = getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS);'),
              ('new File(getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS), "black-cache.7z").getAbsolutePath()', 'new File(getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS), "black-cache.7z").getAbsolutePath()'),
              ('String mOutputPath = getGameDir().getAbsolutePath();', 'String mOutputPath = getFilesDir().getAbsolutePath() + "/LUXRUSSIA";'),
          ])
          EOF

      - name: Create local server files
        run: |
          mkdir -p app/src/main/assets
          echo '[{"color":"FF0000","dopname":"SAHIL RP","maxonline":1000,"name":"SAHIL","online":0}]' > app/src/main/assets/server.json
          echo '[]' > app/src/main/assets/stories.json

      - name: Patch Interface.java
        run: |
          INTERFACE="app/src/main/java/com/Parad1st/launcher/other/Interface.java"
          if [ -f "$INTERFACE" ]; then
            sed -i 's|https://raw.githubusercontent.com/Parad1st/Black-Russia-Source/main/Json%20files/servers.json|file:///android_asset/server.json|g' "$INTERFACE"
            sed -i 's|https://raw.githubusercontent.com/Parad1st/Black-Russia-Source/main/Json%20files/stories.json|file:///android_asset/stories.json|g' "$INTERFACE"
          fi

      - name: Download other .so files
        run: |
          SO_DIR="app/src/main/jniLibs/armeabi-v7a"
          mkdir -p "$SO_DIR"
          BASE="https://raw.githubusercontent.com/Parad1st/Black-Russia-Source/main/app/src/main/jniLibs/armeabi-v7a"
          for f in libImmEmulatorJ.so libSCAnd.so libbass.so libparad1st.so libsampvoice.so; do
            curl -sL "$BASE/$f" -o "$SO_DIR/$f"
            SIZE=$(stat -c%s "$SO_DIR/$f" 2>/dev/null || echo 0)
            if [ "$SIZE" -lt 1000 ]; then echo "ERROR: $f"; exit 1; fi
            echo "$f OK"
          done

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          sdkmanager --licenses < /dev/null || true

      - name: Create debug keystore
        run: |
          rm -f app/edgar.jks
          keytool -genkey -v -keystore app/edgar.jks -alias key0 -keyalg RSA -keysize 2048 -validity 10000 -storepass edgar333 -keypass edgar333 -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, S=Debug, C=US"

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew clean assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sahil-rp-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
