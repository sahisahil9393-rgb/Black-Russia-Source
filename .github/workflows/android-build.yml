name: Build MATRESHKARP

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  SERVER_IP: "94.23.168.153"
  SERVER_PORT: "2144"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4

      # ── 2. Patch .so binaries (IP as 4 raw bytes + Port as uint16 LE) ──
      - name: Patch .so binaries
        run: |
          IP="${{ env.SERVER_IP }}"
          PORT="${{ env.SERVER_PORT }}"
          echo "Patching .so files for IP: $IP:$PORT"
          python3 << 'PYEOF'
          import os
          import struct

          SO_DIR = "app/src/main/jniLibs/armeabi-v7a"

          # IP as 4 raw bytes (e.g., 94.23.168.153 -> [94, 23, 168, 153])
          NEW_IP = bytes([94, 23, 168, 153])

          # Port as uint16 little-endian (e.g., 2144 -> [0x60, 0x08])
          NEW_PORT = struct.pack('<H', 2144)

          # Old IPs to search for (as 4 raw bytes)
          OLD_IPS = [
              bytes([65, 108, 99, 34]),    # 65.108.99.34
              bytes([0, 0, 0, 0]),          # 0.0.0.0
              bytes([127, 0, 0, 1]),        # 127.0.0.1
          ]

          # Old ports to search for (as uint16 LE)
          OLD_PORTS = [
              struct.pack('<H', 2369),      # 0x0941
              struct.pack('<H', 7777),      # 0x1E61
              struct.pack('<H', 0),         # 0x0000
          ]

          patched_files = []

          for filename in os.listdir(SO_DIR):
              if not filename.endswith('.so'):
                  continue

              filepath = os.path.join(SO_DIR, filename)
              with open(filepath, "rb") as f:
                  data = bytearray(f.read())

              ip_patched = False
              port_patched = False

              # Patch IP (as 4 raw bytes)
              for old_ip in OLD_IPS:
                  count = data.count(old_ip)
                  if count > 0:
                      data = data.replace(old_ip, NEW_IP)
                      ip_patched = True
                      print(f"  {filename}: Replaced {count}x IP {list(old_ip)} -> {list(NEW_IP)}")

              # Patch Port (as uint16 LE)
              for old_port in OLD_PORTS:
                  count = data.count(old_port)
                  if count > 0:
                      data = data.replace(old_port, NEW_PORT)
                      port_patched = True
                      print(f"  {filename}: Replaced {count}x Port {old_port.hex()} -> {NEW_PORT.hex()}")

              if ip_patched or port_patched:
                  with open(filepath, "wb") as f:
                      f.write(data)
                  patched_files.append(filename)

          if patched_files:
              print(f"\nPatched: {', '.join(patched_files)}")
          else:
              print("\nWARNING: No patches applied. .so files may already be correct or use different format.")
          PYEOF

      # ── 3. Fix package names ──
      - name: Fix package names
        run: |
          echo "=== FIXING PACKAGE NAMES ==="
          python3 << 'PYEOF'
          import os
          fixed = 0
          def fix(path):
              global fixed
              with open(path, 'r', encoding='utf-8') as f:
                  content = f.read()
              orig = content
              content = content.replace('com.byparad1st', 'com.Parad1st')
              content = content.replace("namespace 'com.byparad1st.game'", "namespace 'com.Parad1st.game'")
              content = content.replace('package="com.byparad1st.game"', 'package="com.Parad1st.game"')
              if content != orig:
                  with open(path, 'w', encoding='utf-8') as f:
                      f.write(content)
                  print(f'[FIXED] {os.path.basename(path)}')
                  fixed += 1
          for root, dirs, files in os.walk('app/src/main/java'):
              for file in files:
                  if file.endswith('.java'):
                      fix(os.path.join(root, file))
          fix('app/build.gradle')
          fix('app/src/main/AndroidManifest.xml')
          print(f'=== FIXED {fixed} FILES ===')
          PYEOF

      # ── 4. Fix GTASA.java to load game ──
      - name: Fix GTASA.java
        run: |
          echo "=== FIXING GTASA.java ==="
          cat > app/src/main/java/com/Parad1st/game/core/GTASA.java << 'JAVAEOF'
          package com.Parad1st.game.core;

          import android.os.Bundle;
          import android.view.View;
          import com.nvidia.devtech.NvEventQueueActivity;

          public class GTASA extends NvEventQueueActivity {
              static {
                  System.loadLibrary("ImmEmulatorJ");
                  System.loadLibrary("GTASA");
                  System.loadLibrary("sampvoice");
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY |
                      View.SYSTEM_UI_FLAG_FULLSCREEN |
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                  );
              }
          }
          JAVAEOF
          echo "GTASA.java fixed"

      # ── 5. Verify ──
      - name: Verify
        run: |
          echo "=== GTASA.java ==="
          cat app/src/main/java/com/Parad1st/game/core/GTASA.java
          echo "=== applicationId ==="
          grep "applicationId" app/build.gradle
          echo "=== GTASA in Manifest ==="
          grep "GTASA" app/src/main/AndroidManifest.xml

      # ── 6. Java + SDK ──
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          sdkmanager --licenses < /dev/null || true

      # ── 7. Keystore + Build ──
      - name: Delete old keystore
        run: rm -f app/edgar.jks

      - name: Create debug keystore
        run: |
          keytool -genkey -v -keystore app/edgar.jks -alias key0 -keyalg RSA -keysize 2048 -validity 10000 -storepass edgar333 -keypass edgar333 -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, S=Debug, C=US"

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew clean assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      # ── 8. Upload ──
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: matreshka-release
          path: app/build/outputs/apk/ver/release/*.apk
          if-no-files-found: error
