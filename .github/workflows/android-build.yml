name: Build MATRESHKARP

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  SERVER_IP: "94.23.168.153"
  SERVER_PORT: "2144"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4

      # ── 2. REMOVE applicationIdSuffix (simplify package name) ──
      - name: Remove .ver suffix
        run: |
          sed -i '/applicationIdSuffix/d' app/build.gradle
          echo "=== applicationIdSuffix REMOVED ==="
          grep -A3 "productFlavors" app/build.gradle || true

      # ── 3. Download FRESH .so from original repo ──
      - name: Download fresh .so files
        run: |
          echo "=== DOWNLOADING FRESH .so FILES ==="
          SO_DIR="app/src/main/jniLibs/armeabi-v7a"
          BASE="https://raw.githubusercontent.com/Parad1st/Black-Russia-Source/main/app/src/main/jniLibs/armeabi-v7a"

          for f in libGTASA.so libImmEmulatorJ.so libSCAnd.so libbass.so libparad1st.so libsampvoice.so; do
            curl -sL "$BASE/$f" -o "$SO_DIR/$f"
            SIZE=$(stat -c%s "$SO_DIR/$f" 2>/dev/null || echo 0)
            if [ "$SIZE" -lt 1000 ]; then
              echo "  ERROR: $f download failed ($SIZE bytes)"
              exit 1
            fi
            echo "  $f ($SIZE bytes) OK"
          done

      # ── 4. INSPECT .so files (find what IP is actually inside) ──
      - name: Inspect .so files for IP
        run: |
          echo "=== INSPECTING .so FILES ==="
          python3 << 'PYEOF'
          import os, struct, re

          SO_DIR = "app/src/main/jniLibs/armeabi-v7a"

          for filename in sorted(os.listdir(SO_DIR)):
              if not filename.endswith('.so'):
                  continue
              filepath = os.path.join(SO_DIR, filename)
              with open(filepath, "rb") as f:
                  data = f.read()

              print(f"
{filename} ({len(data)} bytes):")

              # Search for IP text patterns
              ascii_text = data.decode('latin-1', errors='ignore')
              ip_pattern = re.compile(r'(?:[0-9]{1,3}\.){3}[0-9]{1,3}')
              ips = set(ip_pattern.findall(ascii_text))
              if ips:
                  print(f"  IP strings found: {sorted(ips)}")

              # Search for port 2369 (0x0941) as uint16 LE
              port_2369 = struct.pack('<H', 2369)
              count_2369 = data.count(port_2369)
              if count_2369 > 0:
                  print(f"  Port 2369 found: {count_2369} times")

              # Search for port 2144 (0x0860) as uint16 LE
              port_2144 = struct.pack('<H', 2144)
              count_2144 = data.count(port_2144)
              if count_2144 > 0:
                  print(f"  Port 2144 found: {count_2144} times")
          PYEOF

      # ── 5. PATCH .so files ──
      - name: Patch .so binaries
        run: |
          echo "=== PATCHING .so FILES ==="
          python3 << 'PYEOF'
          import os, struct

          SO_DIR = "app/src/main/jniLibs/armeabi-v7a"
          NEW_IP = bytes([94, 23, 168, 153])
          NEW_PORT = struct.pack('<H', 2144)

          # Try multiple old IPs
          OLD_IPS = [
              bytes([65, 108, 99, 34]),    # 65.108.99.34
              bytes([0, 0, 0, 0]),
              bytes([127, 0, 0, 1]),
          ]
          OLD_PORTS = [
              struct.pack('<H', 2369),
              struct.pack('<H', 7777),
              struct.pack('<H', 0),
          ]

          for filename in os.listdir(SO_DIR):
              if not filename.endswith('.so'):
                  continue
              filepath = os.path.join(SO_DIR, filename)
              with open(filepath, "rb") as f:
                  data = bytearray(f.read())

              patched = False
              for old_ip in OLD_IPS:
                  count = data.count(old_ip)
                  if count > 0:
                      data = data.replace(old_ip, NEW_IP)
                      patched = True
                      print(f"  {filename}: IP patched ({count}x)")

              for old_port in OLD_PORTS:
                  count = data.count(old_port)
                  if count > 0:
                      data = data.replace(old_port, NEW_PORT)
                      patched = True
                      print(f"  {filename}: Port patched ({count}x)")

              with open(filepath, "wb") as f:
                  f.write(data)

              if not patched:
                  print(f"  {filename}: Nothing to patch (already correct?)")
          PYEOF

      # ── 6. REPLACE broken client with original ──
      - name: Replace client
        run: |
          echo "=== REPLACING CLIENT ==="
          rm -rf app/src/main/java/com/Parad1st/game
          mkdir -p app/src/main/java/com/Parad1st/game/core

          BASE="https://raw.githubusercontent.com/Parad1st/Black-Russia-Source/main/app/src/main/java/com/Parad1st"

          # Download critical files
          for f in game/core/GTASA.java game/core/Config.java game/core/Utils.java; do
            curl -sL "$BASE/$f" -o "app/src/main/java/com/Parad1st/$f"
            echo "  $f"
          done

          # Fix package names in downloaded client
          python3 << 'PYEOF'
          import os
          for root, dirs, files in os.walk('app/src/main/java/com/Parad1st/game'):
              for file in files:
                  if file.endswith('.java'):
                      path = os.path.join(root, file)
                      with open(path, 'r') as f:
                          content = f.read()
                      content = content.replace('com.byparad1st', 'com.Parad1st')
                      with open(path, 'w') as f:
                          f.write(content)
          PYEOF

          echo "Client replaced and fixed"

      # ── 7. Fix launcher package names ──
      - name: Fix launcher
        run: |
          python3 << 'PYEOF'
          import os
          def fix(path):
              with open(path, 'r') as f:
                  content = f.read()
              orig = content
              content = content.replace('com.byparad1st', 'com.Parad1st')
              content = content.replace("namespace 'com.byparad1st.game'", "namespace 'com.Parad1st.game'")
              content = content.replace('package="com.byparad1st.game"', 'package="com.Parad1st.game"')
              if content != orig:
                  with open(path, 'w') as f:
                      f.write(content)
          for root, dirs, files in os.walk('app/src/main/java/com/Parad1st/launcher'):
              for file in files:
                  if file.endswith('.java'):
                      fix(os.path.join(root, file))
          fix('app/build.gradle')
          fix('app/src/main/AndroidManifest.xml')
          PYEOF

      # ── 8. Verify ──
      - name: Verify
        run: |
          echo "=== applicationId ==="
          grep "applicationId" app/build.gradle
          echo "=== GTASA.java ==="
          head -15 app/src/main/java/com/Parad1st/game/core/GTASA.java
          echo "=== package ==="
          grep 'package="' app/src/main/AndroidManifest.xml | head -1

      # ── 9. Build ──
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          sdkmanager --licenses < /dev/null || true

      - name: Delete old keystore
        run: rm -f app/edgar.jks

      - name: Create debug keystore
        run: |
          keytool -genkey -v -keystore app/edgar.jks -alias key0 -keyalg RSA -keysize 2048 -validity 10000 -storepass edgar333 -keypass edgar333 -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, S=Debug, C=US"

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew clean assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      # ── 10. Upload ──
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: matreshka-release
          path: app/build/outputs/apk/ver/release/*.apk
          if-no-files-found: error
