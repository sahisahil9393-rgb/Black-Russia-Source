name: Build MATRESHKARP

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  SERVER_IP: "94.23.168.153"
  SERVER_PORT: "2144"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      # ── 1. Checkout your repo ──
      - name: Checkout your repo
        uses: actions/checkout@v4

      # ── 2. Patch libsamp.so binary directly (NO ndk-build!) ──
      - name: Patch libsamp.so binary
        run: |
          IP="${{ env.SERVER_IP }}"
          PORT="${{ env.SERVER_PORT }}"
          echo "Patching libsamp.so: $IP:$PORT"

          python3 << 'PYEOF'
          import struct
          import sys

          SO_PATH = "app/src/main/jniLibs/armeabi-v7a/libsamp.so"
          NEW_IP = b"94.23.168.153"
          OLD_IP = b"65.108.99.34"

          with open(SO_PATH, "rb") as f:
              data = bytearray(f.read())

          # Find and replace IP
          count = data.count(OLD_IP)
          print(f"Found {count} occurrences of old IP")

          if count > 0:
              # Pad new IP with null bytes to match old length
              padded_ip = NEW_IP.ljust(len(OLD_IP), b'\x00')
              data = data.replace(OLD_IP, padded_ip)

              with open(SO_PATH, "wb") as f:
                  f.write(data)
              print(f"Patched {count} IP addresses")
          else:
              print("Old IP not found — may already be patched or different format")

          # Also try to find port 2369 (0x0941 in little-endian)
          old_port = struct.pack('<H', 2369)
          new_port = struct.pack('<H', 2144)

          port_count = data.count(old_port)
          if port_count > 0:
              data = data.replace(old_port, new_port)
              with open(SO_PATH, "wb") as f:
                  f.write(data)
              print(f"Patched {port_count} port addresses")
          else:
              print("Port not found in expected format")

          print("Done!")
          PYEOF

          echo "libsamp.so patched"

      # ── 3. Java 17 + Android SDK ──
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          sdkmanager --licenses < /dev/null || true

      # ── 4. Keystore + APK (your original) ──
      - name: Delete old keystore
        run: rm -f app/edgar.jks

      - name: Create debug keystore
        run: |
          keytool -genkey -v -keystore app/edgar.jks -alias key0 -keyalg RSA -keysize 2048 -validity 10000 -storepass edgar333 -keypass edgar333 -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, S=Debug, C=US"

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew clean assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      # ── 5. Upload ──
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload libsamp.so
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libsamp-so
          path: app/src/main/jniLibs/armeabi-v7a/libsamp.so

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: matreshka-release
          path: app/build/outputs/apk/ver/release/*.apk
          if-no-files-found: error
