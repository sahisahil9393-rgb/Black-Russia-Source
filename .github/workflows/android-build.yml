name: Build MATRESHKARP

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  SERVER_IP: "94.23.168.153"
  SERVER_PORT: "2144"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4

      - name: Fix build.gradle
        run: |
          sed -i "s/applicationId 'com\\.parad1stgames\\.game'/applicationId 'com.byparad1st.game'/g" app/build.gradle
          sed -i "s/namespace 'com\\.parad1stgames\\.game'/namespace 'com.byparad1st.game'/g" app/build.gradle
          sed -i '/applicationIdSuffix/d' app/build.gradle
          sed -i "s/abiFilters 'armeabi-v7a', 'arm64-v8a'/abiFilters 'armeabi-v7a'/g" app/build.gradle

      - name: Fix AndroidManifest.xml
        run: |
          sed -i 's/package="com\.parad1stgames\.game"/package="com.byparad1st.game"/g' app/src/main/AndroidManifest.xml
          sed -i 's|<uses-permission android:name="android.permission.RECORD_AUDIO" />|<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />|g' app/src/main/AndroidManifest.xml

      - name: Fix NvEventQueueActivity.java
        run: |
          sed -i 's/com\.blackrussia\.launcher/com.byparad1st.game/g' app/src/main/java/com/nvidia/devtech/NvEventQueueActivity.java

      - name: Fix MainActivity.java paths
        run: |
          sed -i 's|getExternalFilesDir(null), "LUXRUSSIA"|Environment.getExternalStorageDirectory(), "LUXRUSSIA"|g' app/src/main/java/com/Parad1st/launcher/activity/MainActivity.java
          sed -i 's|new File(getGameDir(), "SAMP/settings.ini")|new File(Environment.getExternalStorageDirectory() + "/LUXRUSSIA/SAMP/settings.ini")|g' app/src/main/java/com/Parad1st/launcher/activity/MainActivity.java
          sed -i 's|new File(getGameDir(), "texdb/gta3.img")|new File(Environment.getExternalStorageDirectory() + "/LUXRUSSIA/texdb/gta3.img")|g' app/src/main/java/com/Parad1st/launcher/activity/MainActivity.java

      - name: Fix LoaderActivity.java paths
        run: |
          sed -i 's|getExternalFilesDir(null), "LUXRUSSIA"|Environment.getExternalStorageDirectory(), "LUXRUSSIA"|g' app/src/main/java/com/Parad1st/launcher/activity/LoaderActivity.java
          sed -i 's|getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS)|Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS)|g' app/src/main/java/com/Parad1st/launcher/activity/LoaderActivity.java

      - name: Create local server files
        run: |
          mkdir -p app/src/main/assets
          echo '[{"color":"FF0000","dopname":"MATRESHKA RP","maxonline":1000,"name":"MATRESHKA","online":0}]' > app/src/main/assets/server.json
          echo '[]' > app/src/main/assets/stories.json

      - name: Patch Interface.java
        run: |
          INTERFACE="app/src/main/java/com/Parad1st/launcher/other/Interface.java"
          if [ -f "$INTERFACE" ]; then
            sed -i 's|https://raw.githubusercontent.com/Parad1st/Black-Russia-Source/main/Json%20files/servers.json|file:///android_asset/server.json|g' "$INTERFACE"
            sed -i 's|https://raw.githubusercontent.com/Parad1st/Black-Russia-Source/main/Json%20files/stories.json|file:///android_asset/stories.json|g' "$INTERFACE"
            sed -i 's|https://raw.githubusercontent.com/Parad1st/Black-Russia-Source/main/Json%20files/donate.json|file:///android_asset/server.json|g' "$INTERFACE"
            sed -i 's|https://raw.githubusercontent.com/Parad1st/Black-Russia-Source/main/Json%20files/music.json|file:///android_asset/stories.json|g' "$INTERFACE"
          fi

      - name: Download .so files
        run: |
          SO_DIR="app/src/main/jniLibs/armeabi-v7a"
          mkdir -p "$SO_DIR"
          BASE="https://raw.githubusercontent.com/Parad1st/Black-Russia-Source/main/app/src/main/jniLibs/armeabi-v7a"
          for f in libGTASA.so libImmEmulatorJ.so libSCAnd.so libbass.so libparad1st.so libsampvoice.so; do
            curl -sL "$BASE/$f" -o "$SO_DIR/$f"
            SIZE=$(stat -c%s "$SO_DIR/$f" 2>/dev/null || echo 0)
            if [ "$SIZE" -lt 1000 ]; then echo "ERROR: $f"; exit 1; fi
            echo "$f OK"
          done
          rm -rf app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/x86 app/src/main/jniLibs/x86_64

      - name: Patch .so binaries
        run: |
          python3 -c "import os, struct; SO_DIR='app/src/main/jniLibs/armeabi-v7a'; NEW_IP=bytes([94,23,168,153]); NEW_PORT=struct.pack('<H',2144); OLD_IPS=[bytes([65,108,99,34]),bytes([0,0,0,0]),bytes([127,0,0,1])]; OLD_PORTS=[struct.pack('<H',2369),struct.pack('<H',7777),struct.pack('<H',0)]; [(__import__('os').path.join(SO_DIR,f),(__import__('builtins').open(__import__('os').path.join(SO_DIR,f),'rb').read(),__import__('builtins').open(__import__('os').path.join(SO_DIR,f),'wb').write(__import__('builtins').bytearray(__import__('builtins').open(__import__('os').path.join(SO_DIR,f),'rb').read().replace(o,NEW_IP).replace(p,NEW_PORT)) for o in OLD_IPS for p in OLD_PORTS]) for f in __import__('os').listdir(SO_DIR) if f.endswith('.so')]"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          sdkmanager --licenses < /dev/null || true

      - name: Create debug keystore
        run: |
          rm -f app/edgar.jks
          keytool -genkey -v -keystore app/edgar.jks -alias key0 -keyalg RSA -keysize 2048 -validity 10000 -storepass edgar333 -keypass edgar333 -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, S=Debug, C=US"

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew clean assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: matreshka-release
          path: app/build/outputs/apk/ver/release/*.apk
          if-no-files-found: error
