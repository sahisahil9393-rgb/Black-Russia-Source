name: Build MATRESHKARP

on:
  workflow_dispatch:
    inputs:
      server_ip:
        description: 'Server IP (e.g. 94.23.168.153)'
        required: true
        default: '94.23.168.153'
      server_port:
        description: 'Server Port (e.g. 2144)'
        required: true
        default: '2144'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      # ── 1. Checkout your repo ──
      - name: Checkout your repo
        uses: actions/checkout@v4

      # ── 2. Setup Java 17 ──
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ── 3. Setup Android SDK ──
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          sdkmanager --licenses < /dev/null || true

      # ── 4. TRY: Build libsamp.so from source ──
      # If this fails, workflow continues with existing libsamp.so
      - name: Build libsamp.so (optional)
        continue-on-error: true
        run: |
          echo "=== Attempting to build libsamp.so ==="

          # Fetch Jni source
          git clone --depth 1 https://github.com/Parad1st/Black-Russia-Source.git /tmp/parad1st
          cp -r "/tmp/parad1st/Jni source" ./jni_source

          # Patch IP/Port
          SERVER_IP="${{ github.event.inputs.server_ip || '94.23.168.153' }}"
          SERVER_PORT="${{ github.event.inputs.server_port || '2144' }}"
          SUM=$(echo "$SERVER_IP" | awk -F. '{print $1+$2+$3+$4}')
          LEN=${#SERVER_IP}
          sed -i "s|CSetServer::create(\".*\", [0-9]\+, [0-9]\+, [0-9]\+, false)|CSetServer::create(\"$SERVER_IP\", $SUM, $LEN, $SERVER_PORT, false)|g" jni_source/jni/clientlogic/CNetwork.cpp

          # Download NDK r17c
          wget -q https://dl.google.com/android/repository/android-ndk-r17c-linux-x86_64.zip
          unzip -q android-ndk-r17c-linux-x86_64.zip

          # Build
          export ANDROID_NDK_HOME="$PWD/android-ndk-r17c"
          cd jni_source
          rm -rf obj libs
          "$ANDROID_NDK_HOME/ndk-build" clean
          "$ANDROID_NDK_HOME/ndk-build" APP_ABI=armeabi-v7a -j$(nproc)

          # Replace if built successfully
          if [ -f "libs/armeabi-v7a/libsamp.so" ]; then
            cp libs/armeabi-v7a/libsamp.so ../app/src/main/jniLibs/armeabi-v7a/libsamp.so
            echo "✅ libsamp.so built and replaced!"
          fi

      # ── 5. Keystore + APK Build (YOUR ORIGINAL WORKFLOW) ──
      - name: Delete old keystore
        run: rm -f app/edgar.jks

      - name: Create debug keystore
        run: |
          keytool -genkey -v -keystore app/edgar.jks -alias key0 -keyalg RSA -keysize 2048 -validity 10000 -storepass edgar333 -keypass edgar333 -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, S=Debug, C=US"

      - name: Check BASS library exists
        run: |
          ls -la app/src/main/cpp/vendor/bass/libs/ || echo "BASS libs folder not found"
          find app/src/main/cpp -name "libbass.so" || echo "libbass.so not found anywhere"

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew clean assembleRelease --no-daemon --refresh-dependencies --stacktrace 2>&1 | tee build.log

      # ── 6. Upload artifacts (YOUR ORIGINAL WORKFLOW) ──
      - name: Upload build log (even if failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload libsamp.so
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libsamp-so
          path: app/src/main/jniLibs/armeabi-v7a/libsamp.so

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: matreshka-release
          path: app/build/outputs/apk/ver/release/*.apk
          if-no-files-found: error
