name: Build MATRESHKARP

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  SERVER_IP: "94.23.168.153"
  SERVER_PORT: "2144"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4

      - name: Download fresh .so files
        run: |
          echo "Downloading fresh .so files..."
          SO_DIR="app/src/main/jniLibs/armeabi-v7a"
          BASE="https://raw.githubusercontent.com/Parad1st/Black-Russia-Source/main/app/src/main/jniLibs/armeabi-v7a"
          for f in libGTASA.so libImmEmulatorJ.so libSCAnd.so libbass.so libparad1st.so libsampvoice.so; do
            curl -sL "$BASE/$f" -o "$SO_DIR/$f"
            echo "  $f ($(stat -c%s "$SO_DIR/$f") bytes)"
          done

      - name: Patch .so binaries
        run: |
          IP="${{ env.SERVER_IP }}"
          PORT="${{ env.SERVER_PORT }}"
          echo "Patching .so for IP: $IP:$PORT"
          python3 << 'PYEOF'
          import os, struct
          SO_DIR = "app/src/main/jniLibs/armeabi-v7a"
          NEW_IP = b"94.23.168.153"
          NEW_PORT = struct.pack('<H', 2144)
          OLD_IP = b"65.108.99.34"
          OLD_PORT = struct.pack('<H', 2369)
          for filename in os.listdir(SO_DIR):
              if not filename.endswith('.so'):
                  continue
              filepath = os.path.join(SO_DIR, filename)
              with open(filepath, "rb") as f:
                  data = bytearray(f.read())
              ip_done = False
              port_done = False
              if OLD_IP in data:
                  padded = NEW_IP.ljust(len(OLD_IP), b'\x00')
                  data = data.replace(OLD_IP, padded)
                  ip_done = True
              if OLD_PORT in data:
                  data = data.replace(OLD_PORT, NEW_PORT)
                  port_done = True
              with open(filepath, "wb") as f:
                  f.write(data)
              if ip_done or port_done:
                  print(f"  {filename}: IP={ip_done}, Port={port_done}")
          PYEOF

      - name: Fix package names
        run: |
          echo "=== FIXING PACKAGE NAMES ==="
          python3 << 'PYEOF'
          import os
          fixed = 0
          def fix(path):
              global fixed
              with open(path, 'r', encoding='utf-8') as f:
                  content = f.read()
              orig = content
              content = content.replace('com.byparad1st', 'com.Parad1st')
              content = content.replace("namespace 'com.byparad1st.game'", "namespace 'com.Parad1st.game'")
              content = content.replace('package="com.byparad1st.game"', 'package="com.Parad1st.game"')
              if content != orig:
                  with open(path, 'w', encoding='utf-8') as f:
                      f.write(content)
                  print(f'[FIXED] {os.path.basename(path)}')
                  fixed += 1
          for root, dirs, files in os.walk('app/src/main/java'):
              for file in files:
                  if file.endswith('.java'):
                      fix(os.path.join(root, file))
          fix('app/build.gradle')
          fix('app/src/main/AndroidManifest.xml')
          print(f'=== FIXED {fixed} FILES ===')
          PYEOF

      # ── FIX GTASA.java to load native libraries ──
      - name: Fix GTASA.java to load game
        run: |
          echo "=== FIXING GTASA.java ==="
          cat > app/src/main/java/com/Parad1st/game/core/GTASA.java << 'JAVAEOF'
          package com.Parad1st.game.core;

          import android.os.Bundle;
          import android.view.View;
          import com.nvidia.devtech.NvEventQueueActivity;

          public class GTASA extends NvEventQueueActivity {
              static {
                  System.loadLibrary("ImmEmulatorJ");
                  System.loadLibrary("GTASA");
                  System.loadLibrary("sampvoice");
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY |
                      View.SYSTEM_UI_FLAG_FULLSCREEN |
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                  );
              }
          }
          JAVAEOF
          echo "GTASA.java patched to extend NvEventQueueActivity and load .so libraries"

      - name: Verify
        run: |
          echo "=== GTASA.java contents ==="
          cat app/src/main/java/com/Parad1st/game/core/GTASA.java
          echo "=== applicationId ==="
          grep "applicationId" app/build.gradle
          echo "=== GTASA in Manifest ==="
          grep "GTASA" app/src/main/AndroidManifest.xml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          sdkmanager --licenses < /dev/null || true

      - name: Delete old keystore
        run: rm -f app/edgar.jks

      - name: Create debug keystore
        run: |
          keytool -genkey -v -keystore app/edgar.jks -alias key0 -keyalg RSA -keysize 2048 -validity 10000 -storepass edgar333 -keypass edgar333 -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, S=Debug, C=US"

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew clean assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: matreshka-release
          path: app/build/outputs/apk/ver/release/*.apk
          if-no-files-found: error
